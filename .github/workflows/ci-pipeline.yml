
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Lint Code
        run: flake8 calculator.py test_calculator.py --max-line-length=120

      - name: Run Tests
        run: pytest

      - name: Package Application
        run: |
          mkdir -p dist
          zip dist/calculator-release.zip calculator.py

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/calculator-release.zip
